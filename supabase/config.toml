# إعدادات Supabase CLI / ربط GitHub
# (مطابقة لما ينتجه `supabase init`؛ عدّل major_version ليطابق مشروعك:
#  Dashboard → Settings → Infrastructure → Postgres version)

project_id = "teacher-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# true = المستخدم يؤكد بريده قبل الدخول. تطبيق Flutter يدعم الحالتين.
enable_confirmations = false
