name: Flutter CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.27.0'

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

  build-apk:
    name: Build Release APK
    needs: analyze-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "Creating android platform..."
            flutter create --platforms=android --project-name=teacher_app --org=com.esamnajjar20 __temp
            mv __temp/android .
            rm -rf __temp
          fi
      - name: Force compileSdk 36
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/compileSdk = 35/compileSdk = 36/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion 35/compileSdkVersion 36/g' android/app/build.gradle || true
      - name: Add INTERNET Permission
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST_PATH"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST_PATH"
            echo "INTERNET permission added."
          else
            echo "INTERNET permission already exists."
          fi
      - name: Apply app icon (if configured)
        run: |
          if [ -f "assets/icon/icon.png" ]; then
            echo "Applying launcher icons..."
            dart run flutter_launcher_icons
          else
            echo "No custom icon at assets/icon/icon.png — skipping"
          fi

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define=SUPABASE_URL=\${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=\${{ secrets.SUPABASE_ANON_KEY }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
