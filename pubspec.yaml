name: teacher_app
description: تطبيق إدارة المعلمين - حضور ودرجات وتقارير (Offline-First)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Backend & Offline
  supabase_flutter: ^2.5.6
  powersync: ^1.16.1
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI & Utils
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8
  uuid: ^4.4.0
  collection: ^1.18.0
  equatable: ^2.0.5

  # Export
  excel: ^4.0.3
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^10.1.0
  file_picker: ^8.0.3

  # Connectivity
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
  fonts:
    - family: Cairo
      fonts:
          weight: 700
          weight: 600
