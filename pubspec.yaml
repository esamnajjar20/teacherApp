name: teacher_app
description: تطبيق إدارة المعلمين - حضور ودرجات وتقارير (Offline-First)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Backend + قاعدة محلية للعمل بدون إنترنت
  supabase_flutter: ^2.5.6
  sqflite: ^2.3.3
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI & Utils
  intl: any # الإصدار يحدده flutter_localizations حسب نسخة Flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  uuid: ^4.4.0
  equatable: ^2.0.5

  # Export
  excel: ^4.0.3
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
