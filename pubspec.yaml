name: teacher_app
description: تطبيق إدارة المعلمين - حضور ودرجات وتقارير (Offline-First)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend + قاعدة محلية للعمل بدون إنترنت
  supabase_flutter: ^2.5.6
  sqflite: ^2.3.3
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI & Utils
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  uuid: ^4.4.0
  equatable: ^2.0.5

  # Export
  excel: ^4.0.3
  share_plus: ^10.1.0

  # اختيار ملف Excel/CSV لاستيراد الطلاب
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3 # اختبار طبقة البيانات على SQLite حقيقية
  flutter_launcher_icons: ^0.14.1

# أيقونة التطبيق: شغّل `dart run flutter_launcher_icons` بعد وجود مجلد android/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: '#1E88E5'
  adaptive_icon_foreground: assets/icon/icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    # خط Cairo المضمَّن (انظر assets/google_fonts/README.md)
